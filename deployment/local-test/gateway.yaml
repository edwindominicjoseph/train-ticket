apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-gateway-service
  namespace: train-ticket-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ts-gateway-service
  template:
    metadata:
      labels:
        app: ts-gateway-service
    spec:
      containers:
        - name: ts-gateway-service
          image: ts-gateway-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18888
          env:
            - name: NACOS_ADDRS
              value: nacos.default.svc.cluster.local:8848
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

