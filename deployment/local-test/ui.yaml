apiVersion: v1
kind: ConfigMap
metadata:
  name: ts-ui-dashboard-nginx
  namespace: train-ticket-test
data:
  nginx.conf: |
    worker_processes 1;
    error_log /var/log/nginx/error.log;
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        location / {
          root /usr/share/nginx/html;
          index index.html index.htm;
        }
        location ~* \.html$ {
          root /usr/share/nginx/html;
        }
        location /api/v1/ {
          proxy_pass http://ts-gateway-service:18888;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-ui-dashboard
  namespace: train-ticket-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ts-ui-dashboard
  template:
    metadata:
      labels:
        app: ts-ui-dashboard
    spec:
      containers:
        - name: ts-ui-dashboard
          image: codewisdom/ts-ui-dashboard:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: ts-ui-dashboard-nginx
