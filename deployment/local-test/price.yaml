apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-price-service
  namespace: train-ticket-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ts-price-service
  template:
    metadata:
      labels:
        app: ts-price-service
    spec:
      containers:
        - name: ts-price-service
          image: ts-price-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 16579
          env:
            - name: PRICE_MYSQL_HOST
              value: ts-price-mysql
            - name: PRICE_MYSQL_PORT
              value: "3306"
            - name: PRICE_MYSQL_DATABASE
              value: ts-price-mysql
            - name: PRICE_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ts-price-mysql
                  key: username
            - name: PRICE_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ts-price-mysql
                  key: password
            - name: NACOS_ADDRS
              value: nacos.default.svc.cluster.local:8848
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ts-travel-runtime
                  key: jwt-secret
          startupProbe:
            httpGet:
              path: /api/v1/priceservice/prices/welcome
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/priceservice/prices/welcome
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/priceservice/prices/welcome
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

